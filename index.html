<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuizBlitz AI ⚡</title>
    <!-- LIENS POUR L'APPLICATION MOBILE (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <style>
        :root {
            --primary-color: #00f2ff;
            --secondary-color: #ff0055;
            --success-color: #00ff88;
            --danger-color: #ff4444;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.8);
            --text-color: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 242, 255, 0.15) 0%, transparent 50%), radial-gradient(circle at 100% 100%, rgba(255, 0, 85, 0.1) 0%, transparent 50%);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1);
            border-left: 1px solid rgba(255,255,255,0.1);
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .screen {
            display: none;
            flex-direction: column;
            flex-grow: 1;
            padding: 25px;
            justify-content: center;
        }

        .screen.active { display: flex; }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 42px;
            font-weight: 800;
            text-transform: uppercase;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
        }

        p.subtitle { text-align: center; margin-bottom: 40px; color: #94a3b8; font-size: 16px; }

        label { display: block; margin-bottom: 10px; font-weight: bold; color: var(--primary-color); text-transform: uppercase; font-size: 14px; }

        select, button {
            width: 100%;
            padding: 16px;
            margin-bottom: 25px;
            border-radius: 12px;
            border: 2px solid transparent;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }

        select {
            background-color: #1e293b;
            color: var(--text-color);
            border: 2px solid #334155;
            appearance: none;
        }

        select:focus { outline: none; border-color: var(--primary-color); }

        button {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: #0f172a;
            box-shadow: 0 4px 15px rgba(0, 242, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 242, 255, 0.5); }
        button:active { transform: translateY(1px); }
        button:disabled { background: #334155; color: #64748b; box-shadow: none; transform: none; }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: 800;
            font-size: 18px;
        }

        .header-info { display: flex; gap: 20px; }
        .game-header span span { color: var(--primary-color); }

        .exit-btn {
            width: auto;
            margin: 0;
            padding: 8px 15px;
            font-size: 12px;
            font-weight: bold;
            background: rgba(255, 0, 85, 0.1);
            color: var(--secondary-color);
            border: 1px solid var(--secondary-color);
            box-shadow: none;
            border-radius: 8px;
            text-transform: uppercase;
        }
        .exit-btn:hover { background: var(--secondary-color); color: white; box-shadow: none; transform: none; }

        #timer-bar {
            height: 10px;
            background-color: #334155;
            border-radius: 5px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        #timer-progress {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary-color), var(--primary-color));
            width: 100%;
            box-shadow: 0 0 10px var(--primary-color);
        }

        #question-text {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 40px;
            min-height: 100px;
            line-height: 1.4;
        }

        .option-btn {
            background-color: #1e293b;
            color: var(--text-color);
            border: 2px solid #334155;
            margin-bottom: 15px;
            text-align: left;
            box-shadow: none;
            border-radius: 12px;
        }

        .option-btn:hover { border-color: var(--primary-color); background-color: #24344d; transform: none; box-shadow: none; }
        
        .option-btn.correct { background-color: var(--success-color); color: #0f172a; border-color: var(--success-color); }
        .option-btn.wrong { background-color: var(--danger-color); color: white; border-color: var(--danger-color); }

        #final-score { font-size: 64px; text-align: center; color: var(--success-color); margin-bottom: 20px; font-weight: 800; text-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }
        .loading-spinner { text-align: center; font-size: 18px; color: var(--primary-color); animation: pulse 1.5s infinite; }

        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

    </style>
</head>
<body>

    <div class="app-container">
        <!-- ACCUEIL -->
        <div id="home-screen" class="screen active">
            <h1>QuizBlitz AI</h1>
            <p class="subtitle">⚡ Affronte l'IA et teste ta culture générale ! ⚡</p>
            
            <label for="theme">Choisis ton Thème</label>
            <select id="theme-select">
                <option value="Culture Générale">Culture Générale</option>
                <option value="Sport">Sport</option>
                <option value="Histoire">Histoire</option>
                <option value="Sciences">Sciences</option>
                <option value="Géographie">Géographie</option>
            </select>

            <label for="language">Choisis ta Région / Langue</label>
            <select id="language-select">
                <option value="français (Europe)">🇫🇷 Français (Europe)</option>
                <option value="français (Afrique du Nord/MENA)">🇲🇦 Français (MENA)</option>
                <option value="anglais (International)">🇬🇧 Anglais (International)</option>
                <option value="arabe (MENA)">🇸🇦 Arabe (MENA)</option>
                <option value="espagnol (Espagne et Amérique Latine)">🇪🇸 Espagnol (Latino)</option>
                <option value="portugais (Brésil et Portugal)">🇵🇹 Portugais (BR/PT)</option>
                <option value="russe (Russie et Europe de l'Est)">🇷🇺 Russe (Russie/EE)</option>
                <option value="chinois (Chine et Asie de l'Est)">🇨🇳 Chinois (Asie)</option>
            </select>

            <button id="start-btn">Lancer le Défi (30 Questions)</button>
        </div>

        <!-- JEU -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <div class="header-info">
                    <span>Score: <span id="score">0</span></span>
                    <span>Question: <span id="question-num">1</span>/<span id="total-questions">30</span></span>
                </div>
                <button id="exit-btn" class="exit-btn">Quitter</button>
            </div>
            
            <div id="timer-bar">
                <div id="timer-progress"></div>
            </div>

            <div id="question-text" class="loading-spinner">Chargement...</div>
            <div id="options-container"></div>
        </div>

        <!-- FIN -->
        <div id="end-screen" class="screen">
            <h1>Terminé !</h1>
            <p class="subtitle">Voici ton score final sur 30</p>
            <div id="final-score">0</div>
            <button id="restart-btn">Rejouer</button>
        </div>
    </div>

    <script>
        const GROQ_API_URL = '/api/groq';
        let currentScore = 0;
        let currentQuestionNum = 1;
        const totalQuestions = 30;
        let timerInterval;
        let timeLeft = 15;
        let questionStartTime; // Pour mémoriser quand la question a commencé
        const MIN_TIME_PER_QUESTION = 5; // Limite de 5 secondes minimum par question

        const homeScreen = document.getElementById('home-screen');
        const gameScreen = document.getElementById('game-screen');
        const endScreen = document.getElementById('end-screen');

        document.getElementById('start-btn').addEventListener('click', startQuiz);
        
        document.getElementById('exit-btn').addEventListener('click', () => {
            clearInterval(timerInterval);
            currentScore = 0;
            currentQuestionNum = 1;
            gameScreen.classList.remove('active');
            homeScreen.classList.add('active');
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            currentScore = 0;
            currentQuestionNum = 1;
            endScreen.classList.remove('active');
            homeScreen.classList.add('active');
        });

        async function startQuiz() {
            homeScreen.classList.remove('active');
            gameScreen.classList.add('active');
            currentScore = 0;
            currentQuestionNum = 1;
            document.getElementById('score').innerText = currentScore;
            await loadQuestion();
        }

        async function loadQuestion() {
            document.getElementById('question-num').innerText = currentQuestionNum;
            document.getElementById('question-text').innerText = "L'IA prépare une question...";
            document.getElementById('question-text').classList.add('loading-spinner');
            document.getElementById('options-container').innerHTML = '';

            const theme = document.getElementById('theme-select').value;
            const language = document.getElementById('language-select').value;

            try {
                const response = await fetch(GROQ_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ theme, language })
                });

                if (!response.ok) throw new Error('Erreur API');
                const data = await response.json();
                
                document.getElementById('question-text').classList.remove('loading-spinner');
                document.getElementById('question-text').innerText = data.question;

                const optionsContainer = document.getElementById('options-container');
                data.options.forEach((option, index) => {
                    const btn = document.createElement('button');
                    btn.innerText = option;
                    btn.classList.add('option-btn');
                    btn.addEventListener('click', () => selectAnswer(index, data.correct_index, btn));
                    optionsContainer.appendChild(btn);
                });

                startTimer();
            } catch (error) {
                document.getElementById('question-text').innerText = "Erreur de connexion. Réessaie.";
            }
        }

        function startTimer() {
            questionStartTime = Date.now(); // On enregistre l'heure de début
            timeLeft = 15;
            const timerProgress = document.getElementById('timer-progress');
            timerProgress.style.transition = 'none';
            timerProgress.style.width = '100%';
            
            setTimeout(() => {
                timerProgress.style.transition = 'width 15s linear';
                timerProgress.style.width = '0%';
            }, 100);

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    selectAnswer(-1, -1, null);
                }
            }, 1000);
        }

        function selectAnswer(selectedIndex, correctIndex, clickedBtn) {
            // On arrête le chrono visuel, il se gèle là où il est !
            clearInterval(timerInterval);
            const timerProgress = document.getElementById('timer-progress');
            const computedStyle = window.getComputedStyle(timerProgress);
            const currentWidth = computedStyle.width;
            timerProgress.style.transition = 'none';
            timerProgress.style.width = currentWidth;

            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.style.pointerEvents = 'none');

            if (selectedIndex === correctIndex) {
                clickedBtn.classList.add('correct');
                currentScore += 100;
                document.getElementById('score').innerText = currentScore;
            } else if (selectedIndex !== -1) {
                clickedBtn.classList.add('wrong');
                buttons[correctIndex].classList.add('correct');
            } else {
                buttons[correctIndex].classList.add('correct');
            }

            // NOUVELLE LOGIQUE : Calculer le temps d'attente pour respecter le "timing à l'aise"
            const elapsedTime = (Date.now() - questionStartTime) / 1000;
            let waitTime = 1500; // Temps standard (1.5s) pour montrer la réponse si le joueur a mis plus de 5 sec

            if (elapsedTime < MIN_TIME_PER_QUESTION) {
                // S'il a cliqué trop vite, on calcule combien de temps il faut attendre
                waitTime = (MIN_TIME_PER_QUESTION - elapsedTime) * 1000;
            }

            setTimeout(() => {
                currentQuestionNum++;
                if (currentQuestionNum <= totalQuestions) {
                    loadQuestion();
                } else {
                    endQuiz();
                }
            }, waitTime);
        }

        function endQuiz() {
            gameScreen.classList.remove('active');
            endScreen.classList.add('active');
            document.getElementById('final-score').innerText = currentScore;
        }
    </script>
</body>
</html>
